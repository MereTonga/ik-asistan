services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ik_asistan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ik_asistan_db
    ports:
      # Yalnizca bu makineden erisim (yerel pytest icin). LAN'a acilmaz.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ik_asistan -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ik_asistan:${POSTGRES_PASSWORD}@postgres:5432/ik_asistan_db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ik_asistan:${POSTGRES_PASSWORD}@postgres:5432/ik_asistan_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ik_asistan:${POSTGRES_PASSWORD}@postgres:5432/ik_asistan_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    build: ./backend
    command: celery -A app.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ik_asistan:${POSTGRES_PASSWORD}@postgres:5432/ik_asistan_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
