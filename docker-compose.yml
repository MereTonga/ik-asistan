services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ik_asistan
      POSTGRES_PASSWORD: dev_password_degistir
      POSTGRES_DB: ik_asistan_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
