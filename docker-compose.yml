# Backend servislerinin (migrate/api/worker/beat) ortak tanimi: ayni image, ayni .env, ayni baglanti adresleri.
# Acik image adi: dort servis tek "ik-asistan-backend" imajini paylasir (docker images / docker ps okunabilir kalir).
x-backend: &backend
  image: ik-asistan-backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql://ik_asistan:${POSTGRES_PASSWORD}@postgres:5432/ik_asistan_db
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    OLLAMA_BASE_URL: http://host.docker.internal:11434
    # Log zaman damgalari ve Celery zamanlamasi icin yerel saat dilimi (veritabani UTC'de kalir)
    TZ: ${TZ:-Europe/Istanbul}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ik_asistan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ik_asistan_db
    ports:
      # Yalnizca bu makineden erisim (yerel pytest icin). LAN'a acilmaz.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ik_asistan -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *backend
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # api dosyayi buraya yazar, worker buradan okur: iki container da host'taki ayni klasoru gorur.
      # Honcho modunda da ayni klasor (backend/uploads) kullanildigi icin iki mod arasinda belge kaybolmaz.
      - ./backend/uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: celery -A app.celery_app worker --loglevel=info
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *backend
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ik-asistan-frontend
    build:
      context: ./frontend
      args:
        # Tarayicinin API adresi (build sirasinda gomulur); .env'de NEXT_PUBLIC_API_URL ile degistirilebilir
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TZ: ${TZ:-Europe/Istanbul}
    depends_on:
      - api

volumes:
  pgdata:
